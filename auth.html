<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sign in · NextGPT</title>
<meta name="description" content="Create your NextGPT account or sign in to continue to the AI assistant." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E" />
<style>
:root{
  --bg:#07080d;--bg-soft:#0b0d15;--surface:rgba(255,255,255,.05);--surface-2:rgba(255,255,255,.085);
  --border:rgba(255,255,255,.1);--text:#eef1f8;--muted:#98a0b4;--brand:#6d8bff;--accent:#26d0b0;
  --danger:#ff6b7d;--grad:linear-gradient(120deg,#6d8bff,#8f6dff 55%,#26d0b0);
  --shadow:0 30px 80px -28px rgba(0,0,0,.8);--shadow-glow:0 18px 50px -14px rgba(109,139,255,.5);
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html[data-theme="light"]{--bg:#f6f7fb;--bg-soft:#fff;--surface:rgba(12,16,32,.035);--surface-2:rgba(12,16,32,.07);
  --border:rgba(12,16,32,.11);--text:#101426;--muted:#5b647c;--shadow:0 30px 70px -30px rgba(18,24,45,.3)}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--font);
  display:grid;place-items:center;padding:26px;overflow-x:hidden;transition:background .4s,color .4s}
a{color:var(--brand);text-decoration:none}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.5;animation:drift 20s ease-in-out infinite}
.orb.a{width:55vw;height:55vw;left:-15vw;top:-18vw;background:radial-gradient(circle,#6d8bff,transparent 65%)}
.orb.b{width:45vw;height:45vw;right:-12vw;bottom:-14vw;background:radial-gradient(circle,#8f6dff,transparent 65%);animation-delay:-7s}
.orb.c{width:36vw;height:36vw;left:35vw;bottom:-16vw;background:radial-gradient(circle,#26d0b0,transparent 65%);animation-delay:-13s}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(3vw,2vh,0) scale(1.1)}}

.shell{width:min(460px,100%);animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.98)}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;color:var(--text)}
.mark{width:36px;height:36px;border-radius:12px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:var(--shadow-glow)}
.icon-btn{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);cursor:pointer;font-size:16px}
.card{border:1px solid var(--border);background:linear-gradient(180deg,var(--surface-2),var(--surface));
  backdrop-filter:blur(24px);border-radius:26px;padding:30px;box-shadow:var(--shadow)}
h1{font-size:1.6rem;letter-spacing:-.03em}
.lead{color:var(--muted);font-size:.94rem;margin-top:7px}
.tabs{display:flex;gap:6px;margin:22px 0 20px;padding:5px;border-radius:14px;background:var(--surface);border:1px solid var(--border)}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:var(--muted);
  font-family:inherit;font-weight:640;font-size:.9rem;cursor:pointer;transition:.25s}
.tabs button.on{background:var(--grad);color:#fff;box-shadow:var(--shadow-glow)}
form{display:grid;gap:14px}
label{font-size:.84rem;color:var(--muted);font-weight:600;display:block;margin-bottom:7px}
.field{position:relative}
input{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--border);background:var(--bg-soft);
  color:var(--text);font-family:inherit;font-size:.95rem;transition:border-color .2s,box-shadow .2s}
input:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 4px rgba(109,139,255,.16)}
input.bad{border-color:var(--danger);box-shadow:0 0 0 4px rgba(255,107,125,.14)}
.eye{position:absolute;right:8px;bottom:6px;width:34px;height:34px;border:0;border-radius:10px;background:transparent;
  color:var(--muted);cursor:pointer;font-size:15px}
.err{color:var(--danger);font-size:.8rem;min-height:16px;margin-top:5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--muted)}
.check{display:flex;align-items:center;gap:9px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.btn{padding:14px;border:0;border-radius:14px;background:var(--grad);color:#fff;font-family:inherit;
  font-weight:700;font-size:.98rem;cursor:pointer;box-shadow:var(--shadow-glow);transition:transform .2s,opacity .2s}
.btn:hover{transform:translateY(-2px)}
.btn[disabled]{opacity:.6;cursor:not-allowed;transform:none}
.alt{margin-top:18px;text-align:center;color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,26px);opacity:0;padding:13px 20px;border-radius:14px;
  border:1px solid var(--border);background:var(--bg-soft);box-shadow:var(--shadow);font-size:.92rem;
  transition:.3s;z-index:99;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(38,208,176,.5)}.toast.no{border-color:rgba(255,107,125,.5)}
.strength{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.strength i{display:block;height:100%;width:0;background:var(--grad);transition:width .3s}
.hide{display:none}
.back{display:inline-block;margin-top:18px;color:var(--muted);font-size:.88rem}
@media(max-width:480px){.card{padding:24px 20px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<div class="shell">
  <div class="top">
    <a class="logo" href="/"><span class="mark">✦</span> NextGPT</a>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">🌙</button>
  </div>

  <div class="card">
    <h1 id="head">Welcome back</h1>
    <p class="lead" id="lead">Sign in to continue to your assistant.</p>

    <div class="tabs" role="tablist">
      <button id="tabLogin" class="on" type="button">Login</button>
      <button id="tabRegister" type="button">Register</button>
    </div>

    <!-- LOGIN -->
    <form id="formLogin" novalidate>
      <div>
        <label for="lEmail">Email</label>
        <div class="field"><input id="lEmail" type="email" autocomplete="email" placeholder="you@example.com" /></div>
        <div class="err" id="lEmailErr"></div>
      </div>
      <div>
        <label for="lPass">Password</label>
        <div class="field">
          <input id="lPass" type="password" autocomplete="current-password" placeholder="••••••••" />
          <button class="eye" type="button" data-eye="lPass" aria-label="Show password">👁</button>
        </div>
        <div class="err" id="lPassErr"></div>
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="remember" /> Remember me</label>
        <a href="#forgot" id="toForgot">Forgot password?</a>
      </div>
      <button class="btn" type="submit" id="loginSubmit">Sign in</button>
    </form>

    <!-- REGISTER -->
    <form id="formRegister" class="hide" novalidate>
      <div>
        <label for="rName">Display name</label>
        <div class="field"><input id="rName" type="text" autocomplete="name" placeholder="Ada Lovelace" /></div>
        <div class="err" id="rNameErr"></div>
      </div>
      <div>
        <label for="rEmail">Email</label>
        <div class="field"><input id="rEmail" type="email" autocomplete="email" placeholder="you@example.com" /></div>
        <div class="err" id="rEmailErr"></div>
      </div>
      <div>
        <label for="rPass">Password</label>
        <div class="field">
          <input id="rPass" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
          <button class="eye" type="button" data-eye="rPass" aria-label="Show password">👁</button>
        </div>
        <div class="strength"><i id="bar"></i></div>
        <div class="err" id="rPassErr"></div>
      </div>
      <div>
        <label for="rPass2">Confirm password</label>
        <div class="field"><input id="rPass2" type="password" autocomplete="new-password" placeholder="Repeat password" /></div>
        <div class="err" id="rPass2Err"></div>
      </div>
      <button class="btn" type="submit">Create account</button>
    </form>

    <!-- FORGOT -->
    <form id="formForgot" class="hide" novalidate>
      <div>
        <label for="fEmail">Account email</label>
        <div class="field"><input id="fEmail" type="email" autocomplete="email" placeholder="you@example.com" /></div>
        <div class="err" id="fEmailErr"></div>
      </div>
      <div>
        <label for="fPass">New password</label>
        <div class="field">
          <input id="fPass" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
          <button class="eye" type="button" data-eye="fPass" aria-label="Show password">👁</button>
        </div>
        <div class="err" id="fPassErr"></div>
      </div>
      <button class="btn" type="submit">Reset password</button>
    </form>

    <p class="alt" id="alt">New here? <a href="#register" id="toRegister">Create an account</a></p>
  </div>

  <a class="back" href="/">← Back to home</a>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- theme ---------------- */
(function(){
  var KEY='nextgpt:theme';
  document.documentElement.setAttribute('data-theme',localStorage.getItem(KEY)||'dark');
  document.addEventListener('DOMContentLoaded',function(){
    var b=document.getElementById('themeBtn');
    function paint(){b.textContent=document.documentElement.getAttribute('data-theme')==='dark'?'🌙':'☀️';}
    paint();
    b.onclick=function(){
      var n=document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark';
      document.documentElement.setAttribute('data-theme',n);localStorage.setItem(KEY,n);paint();
    };
  });
})();

/* ---------------- storage helpers ---------------- */
var USERS='nextgpt:users', SESSION='nextgpt:session';
function readUsers(){ try{ return JSON.parse(localStorage.getItem(USERS)||'[]'); }catch(e){ return []; } }
function writeUsers(list){ localStorage.setItem(USERS,JSON.stringify(list)); }
function clean(v){ return String(v==null?'':v).replace(/[<>]/g,'').trim().slice(0,120); }
function hash(str){
  /* Lightweight non-reversible digest — this demo never uses a database. */
  var h1=0x811c9dc5,h2=0x1000193;
  for(var i=0;i<str.length;i++){
    h1=(h1^str.charCodeAt(i))>>>0; h1=(h1*16777619)>>>0;
    h2=(h2+str.charCodeAt(i)*(i+7))>>>0;
  }
  return (h1.toString(16)+h2.toString(16)).padStart(16,'0');
}
var toastEl=document.getElementById('toast'),toastT;
function toast(msg,kind){
  toastEl.textContent=msg; toastEl.className='toast show '+(kind||'');
  clearTimeout(toastT); toastT=setTimeout(function(){toastEl.className='toast';},3200);
}
function setErr(id,msg){
  var e=document.getElementById(id); e.textContent=msg||'';
  var input=document.getElementById(id.replace('Err',''));
  if(input) input.classList.toggle('bad',!!msg);
  return !msg;
}
var emailRe=/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i;

/* ---------------- tab switching ---------------- */
var views={
  login:{form:'formLogin',head:'Welcome back',lead:'Sign in to continue to your assistant.',alt:'New here? <a href="#register" id="toRegister">Create an account</a>'},
  register:{form:'formRegister',head:'Create your account',lead:'Free forever. Your data stays in this browser.',alt:'Already registered? <a href="#login" id="toLogin">Sign in</a>'},
  forgot:{form:'formForgot',head:'Reset your password',lead:'Enter your email and choose a new password.',alt:'<a href="#login" id="toLogin">Back to sign in</a>'}
};
function show(view){
  ['formLogin','formRegister','formForgot'].forEach(function(f){document.getElementById(f).classList.add('hide');});
  var v=views[view]||views.login;
  document.getElementById(v.form).classList.remove('hide');
  document.getElementById('head').textContent=v.head;
  document.getElementById('lead').textContent=v.lead;
  document.getElementById('alt').innerHTML=v.alt;
  document.getElementById('tabLogin').classList.toggle('on',view!=='register');
  document.getElementById('tabRegister').classList.toggle('on',view==='register');
  if(location.hash.replace('#','')!==view) history.replaceState(null,'','#'+view);
  wireLinks();
}
function wireLinks(){
  var r=document.getElementById('toRegister'); if(r) r.onclick=function(e){e.preventDefault();show('register');};
  var l=document.getElementById('toLogin'); if(l) l.onclick=function(e){e.preventDefault();show('login');};
}
document.getElementById('tabLogin').onclick=function(){show('login');};
document.getElementById('tabRegister').onclick=function(){show('register');};
document.getElementById('toForgot').onclick=function(e){e.preventDefault();show('forgot');};

/* password visibility + strength */
document.querySelectorAll('.eye').forEach(function(b){
  b.onclick=function(){
    var i=document.getElementById(b.dataset.eye);
    i.type=i.type==='password'?'text':'password'; b.textContent=i.type==='password'?'👁':'🙈';
  };
});
document.getElementById('rPass').addEventListener('input',function(){
  var v=this.value,s=0;
  if(v.length>=8)s++; if(/[A-Z]/.test(v))s++; if(/[0-9]/.test(v))s++; if(/[^A-Za-z0-9]/.test(v))s++;
  document.getElementById('bar').style.width=(s*25)+'%';
});

/* ---------------- submit handlers ---------------- */
document.getElementById('formLogin').addEventListener('submit',function(e){
  e.preventDefault();
  var email=clean(document.getElementById('lEmail').value).toLowerCase();
  var pass=document.getElementById('lPass').value;
  var ok=setErr('lEmailErr',emailRe.test(email)?'':'Enter a valid email address.');
  ok=setErr('lPassErr',pass.length>=8?'':'Password must be at least 8 characters.')&&ok;
  if(!ok) return;

  var user=readUsers().filter(function(u){return u.email===email;})[0];
  if(!user){ setErr('lEmailErr','No account found for this email.'); return; }
  if(user.password!==hash(pass)){ setErr('lPassErr','Incorrect password.'); return; }

  var btn=document.getElementById('loginSubmit'); btn.disabled=true; btn.textContent='Signing in…';
  localStorage.setItem(SESSION,JSON.stringify({
    email:user.email,username:user.username,displayName:user.displayName,
    remember:document.getElementById('remember').checked,loginAt:Date.now()
  }));
  toast('Welcome back, '+(user.displayName||user.username)+'!','ok');
  setTimeout(function(){ location.href='/chat'; },700);
});

document.getElementById('formRegister').addEventListener('submit',function(e){
  e.preventDefault();
  var name=clean(document.getElementById('rName').value);
  var email=clean(document.getElementById('rEmail').value).toLowerCase();
  var p1=document.getElementById('rPass').value,p2=document.getElementById('rPass2').value;
  var ok=setErr('rNameErr',name.length>=2?'':'Please enter your name.');
  ok=setErr('rEmailErr',emailRe.test(email)?'':'Enter a valid email address.')&&ok;
  ok=setErr('rPassErr',p1.length>=8?'':'Use at least 8 characters.')&&ok;
  ok=setErr('rPass2Err',p1===p2?'':'Passwords do not match.')&&ok;
  if(!ok) return;

  var users=readUsers();
  if(users.some(function(u){return u.email===email;})){ setErr('rEmailErr','This email is already registered.'); return; }

  var user={
    id:'u_'+Date.now().toString(36),email:email,
    username:email.split('@')[0].replace(/[^a-z0-9._-]/gi,'').slice(0,24),
    displayName:name,password:hash(p1),createdAt:Date.now(),
    settings:{theme:localStorage.getItem('nextgpt:theme')||'dark',language:'en',notifications:true}
  };
  users.push(user); writeUsers(users);
  localStorage.setItem(SESSION,JSON.stringify({email:user.email,username:user.username,displayName:user.displayName,remember:true,loginAt:Date.now()}));
  toast('Account created. Taking you to the chat…','ok');
  setTimeout(function(){ location.href='/chat'; },800);
});

document.getElementById('formForgot').addEventListener('submit',function(e){
  e.preventDefault();
  var email=clean(document.getElementById('fEmail').value).toLowerCase();
  var pass=document.getElementById('fPass').value;
  var ok=setErr('fEmailErr',emailRe.test(email)?'':'Enter a valid email address.');
  ok=setErr('fPassErr',pass.length>=8?'':'Use at least 8 characters.')&&ok;
  if(!ok) return;

  var users=readUsers(),idx=-1;
  users.forEach(function(u,i){ if(u.email===email) idx=i; });
  if(idx<0){ setErr('fEmailErr','No account found for this email.'); return; }
  users[idx].password=hash(pass); writeUsers(users);
  toast('Password updated. You can sign in now.','ok');
  setTimeout(function(){ document.getElementById('lEmail').value=email; show('login'); },900);
});

/* ---------------- init ---------------- */
(function(){
  var hash0=location.hash.replace('#','');
  show(views[hash0]?hash0:'login');
  try{
    var s=JSON.parse(localStorage.getItem(SESSION)||'null');
    if(s&&s.email&&s.remember){ document.getElementById('lEmail').value=s.email; document.getElementById('remember').checked=true; }
  }catch(e){}
})();
</script>
</body>
</html>
